name: BBWP Screener

"on":
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbwp-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSARI_API_KEY: ${{ secrets.MESSARI_API_KEY }}
          UNIVERSE_SIZE: "50"
        run: python bbwp_worker.py

      - name: Persist alert state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json data.json)" ]]; then
            git config user.name "bbwp-bot"
            git config user.email "bbwp-bot@users.noreply.github.com"
            git add state.json data.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d text="BBWP screener run FAILED. Check GitHub Actions logs." > /dev/null
