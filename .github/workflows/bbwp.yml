name: BBWP Screener
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */4 * * *'
jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bbwp_worker.py
      - name: Save results
        run: |
          git config user.name "bbwp-bot"
          git config user.email "bbwp-bot@users.noreply.github.com"
          git add -A state.json data.json || true
          git diff --staged --quiet || git commit -m "update snapshot"
          git push || true
